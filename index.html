<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jarves AI</title>
<style>
  :root{
    --bg: #070a10;
    --bg2: #0c1119;
    --panel: #10161f;
    --line: #1c2530;
    --cyan: #45d9e8;
    --cyan-dim: #1e5a63;
    --text: #dfe8ee;
    --text-dim: #7b8a99;
    --danger: #e2545a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(600px 400px at 50% -10%, rgba(69,217,232,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    height:calc(var(--vh, 1vh) * 100);
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- Onboarding screen ---------- */
  #onboard{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
    gap:22px;
  }
  .mark{
    width:64px; height:64px;
    border-radius:18px;
    background:linear-gradient(160deg, var(--cyan-dim), #0a1015);
    border:1px solid rgba(69,217,232,0.35);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(69,217,232,0.18);
  }
  .mark svg{width:30px; height:30px;}
  h1{
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
    font-weight:600;
  }
  .sub{
    color:var(--text-dim);
    font-size:14.5px;
    line-height:1.5;
    max-width:320px;
    margin:0;
  }
  .field{
    width:100%;
    max-width:340px;
    text-align:left;
  }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  input[type="password"], input[type="text"]{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    color:var(--text);
    font-size:15px;
    outline:none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  input:focus{ border-color: var(--cyan); }
  .btn{
    width:100%;
    max-width:340px;
    background:var(--cyan);
    color:#04141a;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn:disabled{ opacity:0.4; }
  .btn.secondary{
    background:transparent;
    color:var(--text-dim);
    border:1px solid var(--line);
    font-weight:500;
  }
  .hint{
    font-size:12px;
    color:var(--text-dim);
    max-width:320px;
    line-height:1.5;
  }
  .hint a{ color:var(--cyan); text-decoration:none; }

  /* ---------- Lock screen ---------- */
  #lock{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    gap:26px;
  }
  #lock .lock-title{
    font-size:16px;
    color:var(--text-dim);
  }
  .pin-dots{
    display:flex;
    gap:16px;
  }
  .pin-dots span{
    width:14px; height:14px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:transparent;
    transition:background 0.15s, border-color 0.15s;
  }
  .pin-dots span.filled{
    background:var(--cyan);
    border-color:var(--cyan);
  }
  .pin-dots.shake{
    animation:shake 0.4s;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px); }
    40%{ transform:translateX(10px); }
    60%{ transform:translateX(-8px); }
    80%{ transform:translateX(8px); }
  }
  #lockError{
    color:var(--danger);
    font-size:12.5px;
    height:16px;
  }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3, 68px);
    gap:16px;
  }
  .keypad button{
    width:68px; height:68px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-size:22px;
    font-weight:500;
  }
  .keypad button:active{ background:var(--line); }
  .keypad .empty{ background:none; border:none; }
  .keypad .keyback{ font-size:18px; color:var(--text-dim); background:none; border:none; }
  #fingerprintBtn{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--cyan);
    font-size:12.5px;
  }
  #fingerprintBtn svg{ width:30px; height:30px; }

  /* ---------- Chat screen ---------- */
  #chat{
    display:none;
    flex-direction:column;
    height:100%;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    background:var(--bg2);
  }
  header .who{ display:flex; align-items:center; gap:10px; }
  header .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
  }
  header h2{ font-size:15.5px; margin:0; font-weight:600; }
  header .modelname{ font-size:11.5px; color:var(--text-dim); }
  header button.icon{
    background:none; border:none; color:var(--text-dim);
    font-size:20px; padding:6px; cursor:pointer;
  }
  header .hdr-actions{
    display:flex;
    align-items:center;
    gap:2px;
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--cyan);
    color:#04141a;
    border-bottom-right-radius:4px;
  }
  .msg.ai{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .msg.sys{
    align-self:center;
    color:var(--text-dim);
    font-size:12.5px;
    background:none;
  }
  .msg.err{
    align-self:flex-start;
    background:rgba(226,84,90,0.12);
    border:1px solid rgba(226,84,90,0.4);
    color:#f2b3b6;
  }
  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:12px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-dim);
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.3;} 40%{opacity:1;} }

  #inputRow{
    display:flex;
    gap:8px;
    padding:10px 12px;
    border-top:1px solid var(--line);
    background:var(--bg2);
  }
  #inputRow textarea{
    flex:1;
    resize:none;
    max-height:110px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:11px 14px;
    color:var(--text);
    font-size:14.5px;
    font-family:inherit;
    outline:none;
  }
  #inputRow textarea:focus{ border-color:var(--cyan); }
  #sendBtn{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--cyan);
    border:none;
    color:#04141a;
    font-size:18px;
    flex-shrink:0;
    cursor:pointer;
  }
  #sendBtn:disabled{ opacity:0.35; }

  /* ---------- Settings sheet ---------- */
  #sheetOverlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    z-index:20;
  }
  #sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--bg2);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    z-index:21;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  #sheet h3{ margin:0; font-size:16px; }
  #sheet .field label{ color:var(--text-dim); font-size:12.5px; margin-bottom:6px; display:block; }
</style>
</head>
<body>

  <!-- Lock screen: PIN + fingerprint -->
  <div id="lock">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#45d9e8" stroke-width="1.4"/><circle cx="12" cy="12" r="3.4" stroke="#45d9e8" stroke-width="1.4"/></svg>
    </div>
    <div class="lock-title">PIN kodni kiriting</div>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span>
    </div>
    <div id="lockError"></div>
    <div class="keypad" id="keypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="empty"></button><button data-key="0">0</button><button class="keyback" id="pinBackspace">⌫</button>
    </div>
    <button id="fingerprintBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 3a7 7 0 0 0-7 7v2a5 5 0 0 0 1 3"/>
        <path d="M12 3a7 7 0 0 1 7 7v3"/>
        <path d="M8 21a5 5 0 0 0 3-4.5V10a1 1 0 1 1 2 0v9"/>
        <path d="M16 21c.5-1 .8-2 .8-4V10"/>
        <path d="M5 14v1a7 7 0 0 0 .8 3.2"/>
      </svg>
      Barmoq izi bilan kirish
    </button>
  </div>

  <!-- Onboarding: API key entry -->
  <div id="onboard">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="#45d9e8" stroke-width="1.4"/><circle cx="12" cy="12" r="3.4" stroke="#45d9e8" stroke-width="1.4"/></svg>
    </div>
    <h1>Jarves AI</h1>
    <p class="sub">Ishga tushirish uchun API kalitingizni kiriting. Kalit faqat shu qurilmada, brauzer xotirasida saqlanadi.</p>

    <div class="field">
      <label for="apiKeyInput">API kalit</label>
      <input id="apiKeyInput" type="password" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="modelInput">Model (ixtiyoriy)</label>
      <input id="modelInput" type="text" placeholder="openrouter/free">
    </div>

    <button class="btn" id="startBtn" disabled>Ochish</button>
    <p class="hint">Kalitni <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a> sahifasidan olishingiz mumkin.</p>
  </div>

  <!-- Chat screen -->
  <div id="chat">
    <header>
      <div class="who">
        <div class="dot"></div>
        <div>
          <h2>Jarves AI</h2>
          <div class="modelname" id="modelLabel">model</div>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="icon" id="refreshBtn" title="Yangilash">⟳</button>
        <button class="icon" id="newChatBtn" title="Yangi suhbat">＋</button>
        <button class="icon" id="settingsBtn" title="Sozlamalar">⚙</button>
      </div>
    </header>

    <div id="messages"></div>

    <div id="inputRow">
      <textarea id="userInput" rows="1" placeholder="Xabar yozing..."></textarea>
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <!-- Settings bottom sheet -->
  <div id="sheetOverlay"></div>
  <div id="sheet">
    <h3>Sozlamalar</h3>
    <div class="field">
      <label for="sheetKey">API kalit</label>
      <input id="sheetKey" type="password" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="sheetModel">Model</label>
      <input id="sheetModel" type="text">
    </div>
    <div class="field">
      <label for="sheetPin">Yangi PIN (4 raqam)</label>
      <input id="sheetPin" type="password" inputmode="numeric" maxlength="4" placeholder="0000">
    </div>
    <button class="btn" id="sheetSave">Saqlash</button>
    <button class="btn secondary" id="sheetClear">Kalitni o'chirish</button>
    <button class="btn secondary" id="sheetClose">Yopish</button>
  </div>

<script>
(function(){
  function setVH(){
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', setVH); }

  var DEFAULT_MODEL = "openrouter/free";
  var STORAGE_KEY = "jarves_api_key";
  var STORAGE_MODEL = "jarves_model";
  var STORAGE_HISTORY = "jarves_history";
  var STORAGE_PIN = "jarves_pin";
  var STORAGE_CRED = "jarves_cred_id";
  var DEFAULT_PIN = "0000";

  var lock = document.getElementById('lock');
  var pinDots = document.getElementById('pinDots');
  var lockError = document.getElementById('lockError');
  var keypad = document.getElementById('keypad');
  var pinBackspace = document.getElementById('pinBackspace');
  var fingerprintBtn = document.getElementById('fingerprintBtn');
  var sheetPin = document.getElementById('sheetPin');

  var onboard = document.getElementById('onboard');
  var chat = document.getElementById('chat');
  var apiKeyInput = document.getElementById('apiKeyInput');
  var modelInput = document.getElementById('modelInput');
  var startBtn = document.getElementById('startBtn');
  var messages = document.getElementById('messages');
  var userInput = document.getElementById('userInput');
  var sendBtn = document.getElementById('sendBtn');
  var modelLabel = document.getElementById('modelLabel');
  var settingsBtn = document.getElementById('settingsBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var newChatBtn = document.getElementById('newChatBtn');
  var sheetOverlay = document.getElementById('sheetOverlay');
  var sheet = document.getElementById('sheet');
  var sheetKey = document.getElementById('sheetKey');
  var sheetModel = document.getElementById('sheetModel');
  var sheetSave = document.getElementById('sheetSave');
  var sheetClear = document.getElementById('sheetClear');
  var sheetClose = document.getElementById('sheetClose');

  var apiKey = "";
  var model = DEFAULT_MODEL;
  var history = [];

  function safeGet(k){
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  }
  function safeSet(k,v){
    try{ localStorage.setItem(k,v); }catch(e){}
  }
  function safeRemove(k){
    try{ localStorage.removeItem(k); }catch(e){}
  }
  function saveHistory(){
    try{ localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history)); }catch(e){}
  }
  function loadHistory(){
    try{
      var raw = localStorage.getItem(STORAGE_HISTORY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }

  function addMessage(role, text){
    var el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function showTyping(){
    var el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typingIndicator';
    el.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }
  function hideTyping(){
    var el = document.getElementById('typingIndicator');
    if(el) el.remove();
  }

  function openChat(){
    onboard.style.display = 'none';
    lock.style.display = 'none';
    chat.style.display = 'flex';
    modelLabel.textContent = model;
    if(messages.children.length === 0){
      var savedHistory = loadHistory();
      if(savedHistory.length){
        history = savedHistory;
        history.forEach(function(m){
          addMessage(m.role === 'user' ? 'user' : 'ai', m.content);
        });
      } else {
        addMessage('sys', 'Ulandi. Savolingizni yozing.');
      }
    }
  }

  // ---------- PIN lock ----------
  var pinBuffer = "";

  function renderPinDots(){
    var dots = pinDots.children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = i < pinBuffer.length ? 'filled' : '';
    }
  }

  function showLockError(msg){
    lockError.textContent = msg;
    pinDots.classList.add('shake');
    setTimeout(function(){ pinDots.classList.remove('shake'); }, 400);
  }

  function checkPin(){
    var savedPin = safeGet(STORAGE_PIN) || DEFAULT_PIN;
    if(pinBuffer === savedPin){
      pinBuffer = "";
      lockError.textContent = "";
      renderPinDots();
      openChat();
    } else {
      showLockError("Noto'g'ri PIN");
      pinBuffer = "";
      setTimeout(renderPinDots, 300);
    }
  }

  keypad.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-key]');
    if(!btn) return;
    if(pinBuffer.length >= 4) return;
    pinBuffer += btn.getAttribute('data-key');
    lockError.textContent = "";
    renderPinDots();
    if(pinBuffer.length === 4){
      setTimeout(checkPin, 120);
    }
  });
  pinBackspace.addEventListener('click', function(){
    pinBuffer = pinBuffer.slice(0, -1);
    renderPinDots();
  });

  function showLock(){
    onboard.style.display = 'none';
    chat.style.display = 'none';
    lock.style.display = 'flex';
    pinBuffer = "";
    renderPinDots();
    lockError.textContent = "";
    setupFingerprintButton();
  }

  // ---------- Fingerprint (WebAuthn platform authenticator) ----------
  function bufToBase64(buf){
    var bytes = new Uint8Array(buf);
    var str = '';
    for(var i=0;i<bytes.length;i++){ str += String.fromCharCode(bytes[i]); }
    return btoa(str);
  }
  function base64ToBuf(b64){
    var str = atob(b64);
    var bytes = new Uint8Array(str.length);
    for(var i=0;i<str.length;i++){ bytes[i] = str.charCodeAt(i); }
    return bytes.buffer;
  }
  function randomBuf(len){
    var arr = new Uint8Array(len);
    if(window.crypto && crypto.getRandomValues){ crypto.getRandomValues(arr); }
    return arr;
  }

  function webAuthnAvailable(){
    return !!(window.PublicKeyCredential && navigator.credentials);
  }

  async function setupFingerprintButton(){
    fingerprintBtn.style.display = 'none';
    if(!webAuthnAvailable()) return;
    try{
      if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable){
        var ok = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        if(ok){ fingerprintBtn.style.display = 'flex'; }
      }
    }catch(e){}
  }

  async function enrollFingerprint(){
    var userId = randomBuf(16);
    var cred = await navigator.credentials.create({
      publicKey:{
        challenge: randomBuf(32),
        rp:{ name:"Jarves AI" },
        user:{ id:userId, name:"jarves-user", displayName:"Jarves AI" },
        pubKeyCredParams:[{ type:"public-key", alg:-7 }, { type:"public-key", alg:-257 }],
        authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required" },
        timeout:60000
      }
    });
    if(cred){ safeSet(STORAGE_CRED, bufToBase64(cred.rawId)); }
    return cred;
  }

  async function verifyFingerprint(credIdB64){
    return navigator.credentials.get({
      publicKey:{
        challenge: randomBuf(32),
        allowCredentials:[{ id: base64ToBuf(credIdB64), type:"public-key" }],
        userVerification:"required",
        timeout:60000
      }
    });
  }

  fingerprintBtn.addEventListener('click', async function(){
    try{
      var storedCred = safeGet(STORAGE_CRED);
      if(storedCred){
        await verifyFingerprint(storedCred);
      } else {
        await enrollFingerprint();
      }
      pinBuffer = "";
      renderPinDots();
      openChat();
    }catch(e){
      showLockError("Barmoq izi tanilmadi");
    }
  });

  function startFromOnboard(){
    var k = apiKeyInput.value.trim();
    var m = modelInput.value.trim();
    if(!k) return;
    apiKey = k;
    model = m || DEFAULT_MODEL;
    safeSet(STORAGE_KEY, apiKey);
    safeSet(STORAGE_MODEL, model);
    openChat();
  }

  apiKeyInput.addEventListener('input', function(){
    startBtn.disabled = apiKeyInput.value.trim().length === 0;
  });
  startBtn.addEventListener('click', startFromOnboard);

  // Restore saved key on load
  var savedKey = safeGet(STORAGE_KEY);
  var savedModel = safeGet(STORAGE_MODEL);
  if(savedKey){
    apiKey = savedKey;
    model = savedModel || DEFAULT_MODEL;
    showLock();
  }

  async function sendMessage(){
    var text = userInput.value.trim();
    if(!text || !apiKey) return;
    addMessage('user', text);
    history.push({role:'user', content:text});
    saveHistory();
    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try{
      var res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: model,
          messages: history
        })
      });

      var data = await res.json();
      hideTyping();

      if(!res.ok){
        var errMsg = (data && data.error && data.error.message) ? data.error.message : ('Xatolik: ' + res.status);
        addMessage('err', errMsg);
        return;
      }

      var reply = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(reply){
        addMessage('ai', reply);
        history.push({role:'assistant', content:reply});
        saveHistory();
      } else {
        addMessage('err', 'Javob olinmadi. Qayta urinib ko\'ring.');
      }
    }catch(e){
      hideTyping();
      addMessage('err', 'Ulanishda xatolik: ' + e.message);
    }finally{
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  userInput.addEventListener('input', function(){
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 110) + 'px';
  });
  userInput.addEventListener('focus', function(){
    setTimeout(function(){
      messages.scrollTop = messages.scrollHeight;
      userInput.scrollIntoView({block:'end'});
    }, 300);
  });

  // Settings sheet
  function openSheet(){
    sheetKey.value = apiKey;
    sheetModel.value = model;
    sheetOverlay.style.display = 'block';
    sheet.style.display = 'flex';
  }
  function closeSheet(){
    sheetOverlay.style.display = 'none';
    sheet.style.display = 'none';
  }
  settingsBtn.addEventListener('click', openSheet);
  refreshBtn.addEventListener('click', function(){
    window.location.reload();
  });
  newChatBtn.addEventListener('click', function(){
    history = [];
    saveHistory();
    messages.innerHTML = '';
    addMessage('sys', 'Yangi suhbat boshlandi.');
  });
  sheetOverlay.addEventListener('click', closeSheet);
  sheetClose.addEventListener('click', closeSheet);
  sheetSave.addEventListener('click', function(){
    var k = sheetKey.value.trim();
    var m = sheetModel.value.trim();
    var p = sheetPin.value.trim();
    if(k){ apiKey = k; safeSet(STORAGE_KEY, apiKey); }
    model = m || DEFAULT_MODEL;
    safeSet(STORAGE_MODEL, model);
    modelLabel.textContent = model;
    if(p.length === 4 && /^[0-9]{4}$/.test(p)){
      safeSet(STORAGE_PIN, p);
      sheetPin.value = '';
    }
    closeSheet();
  });
  sheetClear.addEventListener('click', function(){
    apiKey = "";
    safeRemove(STORAGE_KEY);
    safeRemove(STORAGE_MODEL);
    safeRemove(STORAGE_HISTORY);
    safeRemove(STORAGE_PIN);
    safeRemove(STORAGE_CRED);
    closeSheet();
    chat.style.display = 'none';
    onboard.style.display = 'flex';
    apiKeyInput.value = '';
    modelInput.value = '';
    startBtn.disabled = true;
    messages.innerHTML = '';
    history = [];
  });
})();
</script>
</body>
</html>
